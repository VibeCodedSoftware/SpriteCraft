[package]
name = "spritecraft-setup"
version = "1.0.0"
edition = "2021"
description = "SpriteCraft installer: per-user install with shortcuts and an uninstaller, no administrator rights"
license = "MIT OR Apache-2.0"

[[bin]]
name = "spritecraft-setup"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"
